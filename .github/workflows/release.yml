name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            squashfs-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify before release build
        run: |
          npm run check
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract
          mv squashfs-root /tmp/appimagetool-extracted
          ln -s /tmp/appimagetool-extracted/AppRun /usr/local/bin/appimagetool

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Patch AppImage with Wayland/EGL fix
        run: |
          APPIMAGE=$(echo src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage)
          echo "Patching: ${APPIMAGE}"

          [ -f "${APPIMAGE}" ] || { echo "FEHLER: AppImage nicht gefunden: ${APPIMAGE}"; exit 1; }

          "${APPIMAGE}" --appimage-extract
          mkdir -p squashfs-root/apprun-hooks
          cp src-tauri/appimage-hooks/01-wayland-fix.sh squashfs-root/apprun-hooks/
          chmod +x squashfs-root/apprun-hooks/01-wayland-fix.sh

          ARCH=x86_64 appimagetool squashfs-root "${APPIMAGE}"

          echo "Gepatchtes AppImage: ${APPIMAGE}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Protium ${{ github.ref_name }}"
          body: |
            Siehe README und Changelog für Details.

            **Hinweis für Wayland-Nutzer:** Das AppImage lädt automatisch die system-eigene `libwayland-client.so`,
            falls vorhanden. Kein manuelles `LD_PRELOAD` mehr nötig.
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/appimage/protium_*_amd64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
